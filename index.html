<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══ Security Meta Tags ═══════════════════════════════════════════════ -->
    <!-- Content Security Policy: restrict script/style/connect sources -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self' https://tithishah.design http://localhost:3000;
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <!-- Prevent MIME-type sniffing attacks -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Deny embedding in iframes (clickjacking protection) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- Limit referrer information sent to other origins -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta name="google-site-verification" content="yJQ7k8CDqivMYrftJxpl-0bkRJDrDQDskBqxps_yXP4" />
    <meta name="description" content="Tithi Shah - Full-Stack Developer and Software Architect specializing in React, .NET 8, and AI-powered solutions. Discover premium digital experiences and innovative software engineering." />
    <meta name="keywords" content="Tithi Shah, Full-Stack Developer, Software Architect, React Developer, .NET 8, AI Safety, InnerVoice, Portfolio, Surat, India" />
    <meta name="author" content="Tithi Shah" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tithishah.design/" />
    <meta property="og:title" content="Tithi Shah | Full-Stack Developer & Architect" />
    <meta property="og:description" content="Bridging the gap between technical rigor and visual poetry. Exploring AI safety, IoT, and high-performance web architecture." />
    <meta property="og:image" content="https://tithishah.design/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tithishah.design/" />
    <meta property="twitter:title" content="Tithi Shah | Full-Stack Developer & Architect" />
    <meta property="twitter:description" content="Bridging the gap between technical rigor and visual poetry. Exploring AI safety, IoT, and high-performance web architecture." />
    <meta property="twitter:image" content="https://tithishah.design/og-image.png" />

    <title>Tithi Shah | Full-Stack Developer & Architect</title>
    <!-- Preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
